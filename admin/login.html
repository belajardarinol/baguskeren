<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Apple Color Emoji','Segoe UI Emoji'}</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white border border-slate-200 rounded-xl shadow-sm p-6">
    <h1 class="text-xl font-semibold mb-1">Admin Login</h1>
    <p class="text-slate-500 text-sm mb-6">Masuk untuk mengelola konten.</p>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">Username</label>
        <input id="username" type="text" class="w-full border border-slate-300 rounded-lg px-3 py-2" required />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">Password</label>
        <input id="password" type="password" class="w-full border border-slate-300 rounded-lg px-3 py-2" required />
      </div>
      <button type="submit" class="w-full bg-primary-600 hover:bg-primary-700 text-white font-medium rounded-lg px-4 py-2">Login</button>
    </form>

    <p id="error" class="hidden mt-4 text-sm text-red-600"></p>
  </div>

  <script src="./auth.js"></script>
  <script src="./login.js"></script>
</body>
</html>
