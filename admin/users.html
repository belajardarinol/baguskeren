<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Users - Blog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Apple Color Emoji','Segoe UI Emoji'}</style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div class="min-h-screen flex">
    <aside class="hidden md:flex w-64 flex-col bg-white border-r border-slate-200">
      <div class="h-16 flex items-center px-6 border-b border-slate-200">
        <a href="./index.html" class="text-lg font-semibold text-slate-800">TailAdmin</a>
      </div>
      <nav class="flex-1 p-4 space-y-2">
        <a href="./index.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-50">
          <span>Posts</span>
        </a>
        <a href="./users.html" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-primary-50 text-primary-700 font-medium">
          <span>Users</span>
        </a>
      </nav>
      <div class="p-4 text-xs text-slate-500">© Blog Admin</div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0">
      <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 md:px-6">
        <h1 class="text-lg md:text-xl font-semibold">Users</h1>
        <div class="flex items-center gap-3">
          <button id="btnLogout" class="hidden md:inline-flex px-3 py-2 rounded-lg border border-slate-300">Logout</button>
          <button id="btnNewUser" class="inline-flex items-center gap-2 bg-primary-600 hover:bg-primary-700 text-white px-3 md:px-4 py-2 rounded-lg text-sm font-medium">New User</button>
        </div>
      </header>

      <main class="p-4 md:p-6 overflow-auto">
        <div class="bg-white border border-slate-200 rounded-xl shadow-sm">
          <div class="p-4 md:p-6">
            <div class="overflow-x-auto">
              <table class="min-w-full text-sm">
                <thead>
                <tr class="text-left text-slate-500">
                  <th class="py-2 pr-4">Username</th>
                  <th class="py-2 pr-4">Roles</th>
                  <th class="py-2 pr-4">Created</th>
                  <th class="py-2 pr-4">Updated</th>
                  <th class="py-2 pr-4">Actions</th>
                </tr>
                </thead>
                <tbody id="usersTBody" class="divide-y divide-slate-100"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal -->
  <div id="userModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-slate-900/50"></div>
    <div class="relative mx-auto my-10 max-w-xl bg-white rounded-xl shadow-xl border border-slate-200">
      <div class="flex items-center justify-between px-4 md:px-6 py-3 border-b border-slate-200">
        <h3 id="userModalTitle" class="text-lg font-semibold">New User</h3>
        <button id="btnCloseUserModal" class="p-2 rounded-lg hover:bg-slate-100">✕</button>
      </div>
      <form id="userForm" class="px-4 md:px-6 py-5 space-y-4">
        <input type="hidden" id="userId" />
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Username</label>
          <input id="username" type="text" class="w-full border border-slate-300 rounded-lg px-3 py-2" required />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Password <span class="text-slate-400 text-xs">(leave blank to keep)</span></label>
          <input id="password" type="password" class="w-full border border-slate-300 rounded-lg px-3 py-2" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Roles (comma separated)</label>
          <input id="roles" type="text" class="w-full border border-slate-300 rounded-lg px-3 py-2" />
        </div>
        <div class="flex items-center justify-end gap-2 py-3 border-t border-slate-200">
          <button type="button" id="btnCancelUser" class="px-4 py-2 rounded-lg border border-slate-300">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded-lg bg-primary-600 text-white font-medium">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="./auth.js"></script>
  <script src="./users.js"></script>
</body>
</html>
